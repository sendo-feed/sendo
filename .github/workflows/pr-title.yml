name: PR title

# スカッシュマージでは PR のタイトルがそのままコミットの件名になるので、
# コミットメッセージの規約（CONTRIBUTING.md）に沿っているかを確かめる。

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Conventional Commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          types='feat|fix|docs|decision|refactor|perf|test|build|ci|chore|revert'
          if [[ ! "$TITLE" =~ ^($types)(\([a-z0-9._/-]+\))?!?:\ .+ ]]; then
            echo "::error::PR のタイトルは '<type>(<scope>): <件名>' の形で書く。type は ${types//|/ ／ }。いまのタイトル：$TITLE"
            exit 1
          fi
          if [[ "$TITLE" =~ ^decision[:!] ]]; then
            echo "::error::decision には scope にテーマ名を付ける（例：decision(tech-stack): …）。"
            exit 1
          fi
          echo "OK: $TITLE"

      # pull_request のマージコミットと、その第1親（マージ先）を比較する。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check decision title against changed files
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD -- docs/decisions/)
          if [[ -n "$changed" && "$TITLE" != decision\(* ]]; then
            echo "::error::docs/decisions/ を変更する PR のタイトルは 'decision(<テーマ>): …' にする。"
            exit 1
          fi
          if [[ -z "$changed" && "$TITLE" == decision\(* ]]; then
            echo "::error::decision の PR には docs/decisions/ の変更が必要。"
            exit 1
          fi
