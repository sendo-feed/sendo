name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome ci .

      - name: Typecheck
        run: pnpm typecheck

      # スキーマ（src/db/schema.ts）を変えたのに、マイグレーションを作り忘れていないか
      - name: Check migrations
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "::error::src/db/schema.ts とマイグレーションが合っていない。pnpm db:generate を実行してコミットする"
            exit 1
          fi

      # API を変えたのに、OpenAPI の定義（spec/openapi.json）を書き出し忘れていないか
      - name: Check OpenAPI spec
        run: |
          pnpm openapi:generate
          if [ -n "$(git status --porcelain -- spec)" ]; then
            git --no-pager diff --stat -- spec
            echo "::error::spec/openapi.json が API と合っていない。pnpm openapi:generate を実行してコミットする"
            exit 1
          fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
