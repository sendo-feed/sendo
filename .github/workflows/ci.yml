name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# PR では、新しい push が来たら前の CI を取り消す（ブランチごとに 1 本）。main への push では、
# コミットごとに別のグループにして、どのコミットの CI も取り消さずに動かす。ブランチでまとめると、
# 動いている CI のうしろに待てるのは 1 本だけで、続けてマージすると、待っていたコミットの CI が
# 新しいほうに置き換えられて動かない。どのコミットで落ち始めたかを追えるように、全部を動かす
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # pull_request では、マージコミットとその第1親（マージ先）を比べて、変わったファイルを見る
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      # PR で変わったのが Markdown だけなら、決定の文書の検査だけを動かし、残りの段は飛ばす。
      # ジョブごと飛ばさないのは、Check をマージに必須の検査にしても、成功として残すため。
      # main への push では、いつもすべてを動かす
      - name: Detect docs-only change
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          files=$(git -c core.quotePath=false diff --name-only HEAD^1 HEAD)
          if grep -qv '\.md$' <<<"$files"; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
          else
            echo "docs_only=true" >> "$GITHUB_OUTPUT"
            echo "::notice::変わったのは Markdown だけなので、決定の文書の検査だけを動かす"
          fi

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: steps.changes.outputs.docs_only != 'true'

      # pnpm のキャッシュは pnpm がないと使えないので、文書だけのとき（pnpm を入れない）は使わない
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: ${{ steps.changes.outputs.docs_only != 'true' && 'pnpm' || '' }}

      - name: Check decision docs
        run: node scripts/check-decisions.mjs

      - name: Check Reader environment in Compose
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          directory=$(mktemp -d)
          cp compose.yaml "$directory/"
          cd "$directory"
          unset X_EMBED_ORIGIN
          printf 'GOOGLE_CLIENT_SECRET=compose-test\n' > .env
          for origin in '' 'https://x-embed.example.net'; do
            if [[ -n "$origin" ]]; then
              printf 'X_EMBED_ORIGIN=%s\n' "$origin" >> .env
            fi
            docker compose config --format json | node --input-type=module -e '
              import assert from "node:assert/strict";
              import { readFileSync } from "node:fs";
              const { sendo, reader } = JSON.parse(readFileSync(0, "utf8")).services;
              assert.equal(reader.environment?.X_EMBED_ORIGIN, process.argv[1]);
              assert.equal(sendo.environment.GOOGLE_CLIENT_SECRET, "compose-test");
              assert.ok(!Object.hasOwn(reader.environment, "GOOGLE_CLIENT_SECRET"));
            ' "$origin"
          done

      - name: Install
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm install --frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm exec biome ci .

      - name: Typecheck
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm typecheck

      # スキーマ（src/db/schema.ts）を変えたのに、マイグレーションを作り忘れていないか
      - name: Check migrations
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain -- migrations)" ]; then
            git status --porcelain -- migrations
            echo "::error::src/db/schema.ts とマイグレーションが合っていない。pnpm db:generate を実行してコミットする"
            exit 1
          fi

      # API を変えたのに、OpenAPI の定義（spec/openapi.json）を書き出し忘れていないか
      - name: Check OpenAPI spec
        if: steps.changes.outputs.docs_only != 'true'
        run: |
          pnpm openapi:generate
          if [ -n "$(git status --porcelain -- spec)" ]; then
            git --no-pager diff --stat -- spec
            echo "::error::spec/openapi.json が API と合っていない。pnpm openapi:generate を実行してコミットする"
            exit 1
          fi

      # Rust の依存とビルドの成果物（~/.cargo と target/）をキャッシュし、毎回一からコンパイルしない。
      # 下の Rust の検査（debug）とネイティブのモジュール（release）の両方の分を、1 つのキャッシュに持つ。
      # 置くのは main への push のときだけにし、PR は main のものを読むだけにする（PR ごとに置くと、
      # Container のイメージのキャッシュと同じ枠を食い合うため）。キーは rust-toolchain.toml の版と
      # Cargo.lock から作られるので、どちらかを上げると作り直す
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.docs_only != 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Rust（crates/）の整形、lint、テスト。版は rust-toolchain.toml のものを rustup が入れる
      - name: Rust
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm check:rust

      # テスト（test/platform/node/）が読み込む、Rust のネイティブのモジュールを作る
      - name: Build native module
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build:native

      # 記事の解析の埋め込みのモデル（docs/decisions/article-analysis.md の 6）。取ってきた元のファイル
      # （約 530MB）を、固定ファイルをキーにキャッシュする。置くのは main への push のときだけ（Rust と同じ）
      - name: Restore embedding model
        if: steps.changes.outputs.docs_only != 'true'
        id: model-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/.cache
          key: embedding-model-${{ hashFiles('models/potion-multilingual-128m.json') }}

      # テスト（test/platform/node/analysis-model.test.ts）が、本物のモデルを起動と同じ道で読み込む
      - name: Prepare embedding model
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm model:prepare

      - name: Save embedding model
        if: steps.changes.outputs.docs_only != 'true' && github.ref == 'refs/heads/main' && steps.model-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: models/.cache
          key: embedding-model-${{ hashFiles('models/potion-multilingual-128m.json') }}

      - name: Test
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm test

      - name: Build
        if: steps.changes.outputs.docs_only != 'true'
        run: pnpm build
